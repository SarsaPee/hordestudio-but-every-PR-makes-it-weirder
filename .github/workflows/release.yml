name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4

      - name: Build portable application
        run: ./scripts/build-portable.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "Horde Studio ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file" \
              "dist/Horde-Studio-${GITHUB_REF_NAME}-portable.zip#Horde Studio portable app" \
              "Policy Panic at Bramble and Pike.horde_world#Policy Panic at Bramble and Pike.horde_world"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Horde Studio ${GITHUB_REF_NAME}" \
              --generate-notes \
              "dist/Horde-Studio-${GITHUB_REF_NAME}-portable.zip#Horde Studio portable app"
          fi
