<!doctype html>
<meta charset="utf-8">
<title>Experimental Worlds database read-only diagnostic</title>
<pre id="result">Reading IndexedDB…</pre>
<script>
(() => {
    const output = document.getElementById('result');
    const open = name => new Promise((resolve, reject) => {
        const request = indexedDB.open(name);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error(`Could not open ${name}`));
    });
    const read = (db, store, key) => new Promise((resolve, reject) => {
        const request = db.transaction([store], 'readonly').objectStore(store).get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error(`Could not read ${key}`));
    });
    const summarizeWorlds = worlds => Array.isArray(worlds)
        ? worlds.map(world => ({ id: String(world?.id || ''), name: String(world?.name || '') }))
        : [];
    (async () => {
        const result = { origin: location.origin, databases: [] };
        for (const entry of await indexedDB.databases()) {
            const db = await open(entry.name);
            const summary = { name: entry.name, stores: [...db.objectStoreNames] };
            if (db.objectStoreNames.contains('state')) {
                summary.hostWorlds = summarizeWorlds(await read(db, 'state', 'worlds'));
                const settings = await read(db, 'state', 'globalSettings');
                summary.hostSeededWorldIds = Array.isArray(settings?.seededWorldIds)
                    ? settings.seededWorldIds : [];
                summary.hostIncludedWorldReceipts = Array.isArray(settings?.includedWorldReceipts)
                    ? settings.includedWorldReceipts : [];
            }
            if (db.objectStoreNames.contains('records')) {
                summary.experimental = {
                    worlds: summarizeWorlds(await read(db, 'records', 'worlds')),
                    generation: await read(db, 'records', 'generation'),
                    journal: Boolean(await read(db, 'records', 'migrationJournal')),
                    workspace: Boolean(await read(db, 'records', 'workspace'))
                };
            }
            db.close();
            result.databases.push(summary);
        }
        output.textContent = JSON.stringify(result, null, 2);
    })().catch(error => { output.textContent = `Diagnostic failed: ${error.stack || error}`; });
})();
</script>
