<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Experimental Worlds standalone library smoke</title>
<link rel="stylesheet" href="/experiences/experimental-worlds/styles/scene-pulse-worlds.css"><link rel="stylesheet" href="/experiences/experimental-worlds/styles/world-visuals-and-sidecar.css">
<style>body{font-family:system-ui;background:#151515;color:#eee;padding:2rem}.world-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}.char-card{border:1px solid #555;border-radius:.5rem;overflow:hidden;background:#252525}.char-card-body{padding:1rem}.char-card-name{font-weight:700}.char-card-desc{color:#bbb;margin:.5rem 0}.btn{padding:.4rem .65rem}.form-input{padding:.5rem;width:18rem}</style>
</head><body>
<main id="experimental-worlds-alone-root">
  <h1>Experimental Worlds — isolated library smoke</h1>
  <button id="create-new-world-btn">Create</button><input id="world-search" class="form-input" placeholder="Search worlds">
  <p><span id="world-visible-count"></span> shown · <span id="world-total-count"></span> total</p><div id="world-grid" class="world-grid"></div>
</main>
<script src="/host-adapters/experimental-worlds/experimental-worlds-host-adapter.js"></script>
<script src="/host-adapters/experimental-worlds/experimental-worlds-state-adapter.js"></script>
<script>
window.escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
window.cssUrl = value => String(value || '').replace(/["'()\\<>\n\r]/g, '');
window.isPlainObject = value => !!value && typeof value === 'object' && !Array.isArray(value);
window.safeJsonClone = value => value === undefined ? undefined : JSON.parse(JSON.stringify(value));
window.ExperimentalWorldsHost.configure({persist:async()=>{},persistSharedContinuities:async()=>{},navigate:()=>{},markMediaChanged:()=>{},mediaDirty:()=>false,restoreMediaDirty:()=>{},worldLoadWarning:()=>'',notify:()=>{},confirmModal:()=>{}});
window.ExperimentalWorldsStateAdapter.configure({readShared:key=>({globalSettings:{},systemPresets:[],roleplayOSSources:[],chatContinuities:[],characters:[],chats:{},personas:[],activePersonaId:'',activeSessionId:{},activeCharId:'',activeRoomId:'',rooms:[],theme:'dark',view:'worlds'})[key],writeShared:()=>{}});
window.ExperimentalWorldsStateAdapter.hydrate({worlds:[{id:'standalone-fixture',name:'Standalone Experimental Fixture',description:'A preserved Experimental Worlds fixture rendered without any other Horde experience.',locations:[],entities:[]}],worldInstances:{},activeWorldId:'',worldRecoverySnapshots:{},editingWorld:null,lastWorldStudioId:null,lastWorldStudioTab:null});
</script>
<script src="/experiences/experimental-worlds/runtime/experimental-rpg-mechanics.js"></script>
<script src="/experiences/experimental-worlds/runtime/dossier-claims.js"></script>
<script src="/experiences/experimental-worlds/mechanics/world-mechanics.js"></script>
<script src="/experiences/experimental-worlds/runtime/sidecar-core.js"></script>
<script src="/experiences/experimental-worlds/runtime/world-studio-core.js"></script>
<script>setupWorldsLogic(); renderWorlds(); document.body.dataset.standaloneExperimentalLibrary='ready';</script>
</body></html>
